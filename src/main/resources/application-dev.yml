# Perfil dev - espelha %dev.* do application.properties do Quarkus original.
spring:
  datasource:
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    url: ${DB_URL:jdbc:postgresql://localhost:5432/azzo?currentSchema=azzo_app}
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    show-sql: false

app:
  security:
    jwt:
      private-key-location: classpath:privateKey.pem
      public-key-location: classpath:publicKey.pem
  mail:
    credentials:
      console-fallback-enabled: ${MAIL_CREDENTIALS_CONSOLE_FALLBACK_ENABLED:true}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    br.com.phdigitalcode: DEBUG
